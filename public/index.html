<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0e7c4a">
  <title>الدخول | منصة حساب المقاعد</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="auth-body">
  <main class="auth-card">
    <h1 class="brand-title">منصة حساب المقاعد</h1>
    <p class="brand-sub">أداة لمحاكاة توزيع المقاعد الانتخابية</p>
    <div class="tabs">
      <button class="tab active" data-tab="login" type="button">تسجيل الدخول</button>
      <button class="tab" data-tab="register" type="button">فتح حساب</button>
    </div>
    <form id="loginForm" class="form">
      <label for="loginUsername">اسم المستخدم</label>
      <input id="loginUsername" type="text" required minlength="3" autocomplete="username">
      <label for="loginPassword">كلمة المرور</label>
      <input id="loginPassword" type="password" required autocomplete="current-password">
      <button type="submit" class="btn-primary">دخول</button>
      <p class="msg" id="loginMsg" aria-live="polite"></p>
    </form>
    <form id="registerForm" class="form hidden">
      <label for="regUsername">اسم المستخدم</label>
      <input id="regUsername" type="text" required minlength="3" autocomplete="username">
      <label for="regPassword">كلمة المرور (8 أحرف على الأقل)</label>
      <input id="regPassword" type="password" required minlength="8" autocomplete="new-password">
      <button type="submit" class="btn-primary">فتح الحساب والدخول</button>
      <p class="msg" id="regMsg" aria-live="polite"></p>
    </form>
  </main>
  <script src="/auth.js"></script>
</body>
</html>
